<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Slide Top -->
    <linearGradient id="slideTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="55%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Slide Mid -->
    <linearGradient id="slideMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Sparkle Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- PRO Badge Gradient -->
    <linearGradient id="proBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Text Gradient (MakeSlide) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= ICON EMBEDDED (LEFT 140x140) ================= -->
  <g transform="translate(10, 10)">
    <!-- Base Icon Squircle Canvas (140x140) -->
    <rect x="4" y="4" width="132" height="132" rx="34" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

    <!-- Ambient Glow Behind Decks -->
    <circle cx="70" cy="70" r="42" fill="#0284C7" opacity="0.25"/>

    <!-- Bottom Layer Slide -->
    <g transform="matrix(0.92 0 -0.12 0.95 24 20)" opacity="0.6">
      <rect x="22" y="58" width="76" height="46" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Middle Layer Slide -->
    <g transform="matrix(0.95 0 -0.08 0.97 16 10)" opacity="0.85">
      <rect x="25" y="45" width="76" height="46" rx="6" fill="url(#slideMid)" stroke="#38BDF8" stroke-width="1"/>
    </g>

    <!-- Top Hero Slide -->
    <g>
      <rect x="32" y="32" width="76" height="46" rx="6" fill="url(#slideTop)" stroke="#BAE6FD" stroke-width="1.2"/>
      <!-- Header -->
      <rect x="38" y="38" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.95"/>
      <rect x="38" y="43" width="36" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
      <!-- Mini Cards -->
      <rect x="38" y="49" width="20" height="23" rx="3" fill="#082F49" opacity="0.9" stroke="#38BDF8" stroke-width="0.7"/>
      <rect x="62" y="49" width="20" height="23" rx="3" fill="#082F49" opacity="0.9" stroke="#38BDF8" stroke-width="0.7"/>
      <rect x="86" y="49" width="18" height="23" rx="3" fill="#064E3B" opacity="0.9" stroke="#34D399" stroke-width="0.7"/>
    </g>

    <!-- AI Sparkle Core (Top Right) -->
    <g transform="translate(102, 20)">
      <path d="M0 8 C4.5 8 8 4.5 8 0 C8 4.5 11.5 8 16 8 C11.5 8 8 11.5 8 16 C8 11.5 4.5 8 0 8 Z" fill="url(#sparkleGrad)"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & WORDMARK ================= -->
  <!-- "MakeSlide" -->
  <text x="168" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#textGrad)">
    Make<tspan fill="#38BDF8">Slide</tspan>
  </text>

  <!-- "PRO" Metallic Badge -->
  <g transform="translate(476, 44)">
    <rect x="0" y="0" width="88" height="44" rx="12" fill="url(#proBadgeGrad)" filter="url(#badgeGlow)" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
      PRO
    </text>
  </g>

  <!-- "AI" Tag (Small subtle badge) -->
  <g transform="translate(574, 50)">
    <rect x="0" y="0" width="46" height="32" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2"/>
    <text x="23" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#34D399" text-anchor="middle">
      AI
    </text>
  </g>

  <!-- Subtitle / Slogan Line -->
  <text x="170" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#94A3B8">
    EXECUTIVE PRESENTATION INTELLIGENCE
  </text>
</svg>
