<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Slide 1 (Bottom) Gradient -->
    <linearGradient id="slideBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Slide 2 (Middle) Gradient -->
    <linearGradient id="slideMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Slide 3 (Top Active) Gradient -->
    <linearGradient id="slideTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="55%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Sparkle Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Decks -->
  <circle cx="256" cy="256" r="150" fill="#0284C7" opacity="0.18" filter="url(#softGlow)"/>

  <!-- LAYER 1: Bottom Slide Plate (3D Isometric Stack) -->
  <g transform="matrix(0.92 0 -0.12 0.95 85 65)" opacity="0.55">
    <rect x="80" y="210" width="280" height="170" rx="22" fill="url(#slideBottom)" stroke="#334155" stroke-width="2.5" filter="url(#cardShadow)"/>
  </g>

  <!-- LAYER 2: Middle Slide Plate -->
  <g transform="matrix(0.95 0 -0.08 0.97 55 35)" opacity="0.85">
    <rect x="90" y="160" width="280" height="170" rx="22" fill="url(#slideMid)" stroke="#38BDF8" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="114" y="184" width="70" height="8" rx="4" fill="#93C5FD" opacity="0.75"/>
    <rect x="114" y="202" width="130" height="5" rx="2.5" fill="#DBEAFE" opacity="0.45"/>
  </g>

  <!-- LAYER 3: Top Hero Presentation Slide (Vibrant Gradient Glass) -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="116" width="280" height="170" rx="22" fill="url(#slideTop)" stroke="#BAE6FD" stroke-width="2.5"/>
    
    <!-- Slide Header Bar -->
    <rect x="138" y="138" width="55" height="9" rx="4.5" fill="#FFFFFF" opacity="0.95"/>
    <rect x="138" y="154" width="140" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>

    <!-- Slide Content: 3 Bento Metric Cards -->
    <!-- Card 1: Metric KPI -->
    <rect x="138" y="176" width="68" height="80" rx="10" fill="#082F49" opacity="0.88" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="148" y="188" width="28" height="5" rx="2.5" fill="#7DD3FC"/>
    <rect x="148" y="200" width="48" height="16" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <path d="M148 238 L160 228 L172 232 L190 220" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Card 2: Chart -->
    <rect x="214" y="176" width="68" height="80" rx="10" fill="#082F49" opacity="0.88" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="224" y="188" width="28" height="5" rx="2.5" fill="#7DD3FC"/>
    <rect x="224" y="200" width="48" height="16" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <!-- Bars -->
    <rect x="226" y="234" width="8" height="14" rx="2" fill="#38BDF8"/>
    <rect x="238" y="226" width="8" height="22" rx="2" fill="#34D399"/>
    <rect x="250" y="220" width="8" height="28" rx="2" fill="#FBBF24"/>

    <!-- Card 3: Donut / Progress -->
    <rect x="290" y="176" width="82" height="80" rx="10" fill="#064E3B" opacity="0.9" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="331" cy="208" r="17" fill="none" stroke="#6EE7B7" stroke-width="3.5" stroke-dasharray="72 28"/>
    <rect x="306" y="238" width="50" height="7" rx="3.5" fill="#A7F3D0"/>
  </g>

  <!-- AI Quantum Core Sparkle (Top Right Glow) -->
  <g transform="translate(375, 75)" filter="url(#softGlow)">
    <path d="M0 26 C15 26 26 15 26 0 C26 15 37 26 52 26 C37 26 26 37 26 52 C26 37 15 26 0 26 Z" fill="url(#sparkleGrad)"/>
  </g>
  <!-- Mini Secondary Sparkle -->
  <g transform="translate(345, 55)">
    <path d="M0 12 C7 12 12 7 12 0 C12 7 17 12 24 12 C17 12 12 17 12 24 C12 17 7 12 0 12 Z" fill="#67E8F9" opacity="0.85"/>
  </g>
</svg>
